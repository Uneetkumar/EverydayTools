<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1d4ed8" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGradient)" filter="url(#glow)" />
  
  <!-- Subtle inner border -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" />

  <!-- Calculator / Utility Symbol Screen -->
  <rect x="112" y="112" width="288" height="96" rx="24" fill="#ffffff" fill-opacity="0.2" />
  
  <!-- Screen Digit Indicator Dots / Minus -->
  <circle cx="160" cy="160" r="14" fill="#ffffff" />
  <rect x="200" y="152" width="40" height="16" rx="8" fill="#ffffff" />
  <rect x="300" y="152" width="60" height="16" rx="8" fill="#ffffff" />

  <!-- Keypad Grid (3x2 Buttons) -->
  <!-- Row 1 -->
  <rect x="112" y="240" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.95" />
  <text x="148" y="288" font-family="-apple-system, system-ui, sans-serif" font-size="36" font-weight="900" fill="#1d4ed8" text-anchor="middle">7</text>

  <rect x="220" y="240" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.95" />
  <text x="256" y="290" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="900" fill="#1d4ed8" text-anchor="middle">%</text>

  <rect x="328" y="240" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.95" />
  <text x="364" y="290" font-family="-apple-system, system-ui, sans-serif" font-size="38" font-weight="900" fill="#1d4ed8" text-anchor="middle">+</text>

  <!-- Row 2 -->
  <rect x="112" y="336" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.95" />
  <text x="148" y="386" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="900" fill="#1d4ed8" text-anchor="middle">{ }</text>

  <rect x="220" y="336" width="72" height="72" rx="20" fill="#ffffff" fill-opacity="0.95" />
  <text x="256" y="384" font-family="-apple-system, system-ui, sans-serif" font-size="34" font-weight="900" fill="#1d4ed8" text-anchor="middle">#</text>

  <rect x="328" y="336" width="72" height="72" rx="20" fill="#38bdf8" />
  <text x="364" y="386" font-family="-apple-system, system-ui, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">=</text>
</svg>
