<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="250" fill="#3b82f6" fill-opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="280" fill="#818cf8" fill-opacity="0.12" filter="blur(90px)" />

  <!-- Grid lines -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <!-- Brand Badge -->
  <rect x="80" y="80" width="180" height="42" rx="21" fill="#1e293b" stroke="#3b82f6" stroke-opacity="0.4" />
  <circle cx="105" cy="101" r="6" fill="#3b82f6" />
  <text x="122" y="106" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" fill="#93c5fd" letter-spacing="1">EVERYDAYTOOLS</text>

  <!-- Main Headline -->
  <text x="80" y="210" font-family="-apple-system, system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Fast, Free &amp; Private
  </text>
  <text x="80" y="285" font-family="-apple-system, system-ui, sans-serif" font-size="64" font-weight="900" fill="url(#brandGrad)" letter-spacing="-1">
    Online Calculators &amp; Utilities
  </text>

  <!-- Subtitle -->
  <text x="80" y="360" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    22+ Essential Tools: Image Compressor, PDF to Word, QR Generator, Math &amp; Developer Tools.
  </text>
  <text x="80" y="395" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="500" fill="#64748b">
    100% Client-Side Processing • Zero Latency • No Login Required
  </text>

  <!-- Feature Pills -->
  <g transform="translate(80, 470)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="52" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="90" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">⚡ Instant (0ms)</text>

    <!-- Pill 2 -->
    <rect x="200" y="0" width="190" height="52" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="295" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">🔒 100% Private</text>

    <!-- Pill 3 -->
    <rect x="410" y="0" width="190" height="52" rx="16" fill="#1e293b" stroke="#334155" />
    <text x="505" y="32" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc" text-anchor="middle">⭐ 4.9/5 Rating</text>
  </g>

  <!-- Domain Branding bottom right -->
  <text x="1120" y="555" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="url(#accentGrad)" text-anchor="end">
    everydaytools-s.web.app
  </text>
</svg>
